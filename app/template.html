<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沖縄 地域データアトラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<!-- マップのみの例外。花ブロック等の図はSVG自前描画（外部ライブラリなし）を維持する -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<style>
:root{
  --ground:#E3E1D9; --surface:#F7F6F2; --surface2:#EDEBE4;
  --ink:#151F23; --ink2:#4E5A5F; --ink3:#7B857F;
  --ai:#1D4E5F; --ai2:#2F7288; --kawara:#BE4F2D; --basho:#4C6B4A; --sand:#A79E90;
  --line:#CDC9BE; --line2:#DDD9CF;
  --jp:"Noto Sans JP",system-ui,sans-serif;
  --num:"Roboto Condensed","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ground); color:var(--ink);
  font:400 14px/1.7 var(--jp);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ai2); outline-offset:2px}

/* ---------- eyebrow / labels ---------- */
.eyebrow{
  font:700 10px/1 var(--num); letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink3);
}
.num{font-family:var(--num); font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex; flex-direction:column; height:100%}
header.top{
  border-bottom:1px solid var(--line); background:var(--surface);
  padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{font-weight:700; font-size:15px; letter-spacing:.04em}
.brand span{color:var(--ai)}

/* 「県全体に戻る」。header.top は main の外にあり section.stage だけがスクロールするので、
   position:sticky を使わなくても常時見えている。県レイヤーでも消さずに無効表示で残す
   （消すとヘッダーの幅が変わり、階層を移動するたびにパンくずの位置がずれるため）。 */
.backall{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  background:var(--ai); border:1px solid var(--ai); color:#F7F6F2;
  padding:7px 13px; font:500 12.5px/1.2 var(--jp); letter-spacing:.03em;
}
.backall:hover{background:var(--ai2); border-color:var(--ai2)}
.backall .ar{font-family:var(--num); font-size:14px; line-height:1}
.backall[aria-disabled="true"]{
  background:var(--surface2); border-color:var(--line); color:var(--ink3);
  cursor:default; pointer-events:none;
}

nav.crumb{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
nav.crumb button,nav.crumb .cur{
  display:inline-block; padding:6px 12px; font:500 13px/1.25 var(--jp);
  border:1px solid var(--line); background:var(--surface2); color:var(--ink);
}
nav.crumb button:hover{background:var(--surface); border-color:var(--ai); color:var(--ai)}
nav.crumb .cur{background:var(--ai); border-color:var(--ai); color:#F7F6F2; font-weight:700}
nav.crumb .sep{color:var(--ink3); font-family:var(--num)}

.banner{
  margin-left:auto; display:flex; align-items:center; gap:8px;
  border:1px solid var(--kawara); border-left-width:4px; background:#F6EAE4;
  padding:5px 10px; font-size:11.5px; line-height:1.45; max-width:390px; color:#6E2E19;
}
.banner b{font-family:var(--num); letter-spacing:.08em; text-transform:uppercase; font-size:10px}
.banner a{color:#6E2E19; text-decoration:underline; text-underline-offset:2px; white-space:nowrap}

main{flex:1; display:grid; grid-template-columns:300px 1fr; min-height:0}

/* ---------- rail ---------- */
aside{
  border-right:1px solid var(--line); background:var(--surface2);
  display:flex; flex-direction:column; min-height:0;
}
.searchbox{padding:12px; border-bottom:1px solid var(--line2)}
.searchbox input{
  width:100%; padding:9px 11px; font:400 14px var(--jp);
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
}
.searchbox input::placeholder{color:var(--ink3)}
.hint{margin-top:7px; font-size:11px; color:var(--ink3); line-height:1.5}
.list{overflow-y:auto; flex:1; min-height:0}
.row{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;
  width:100%; text-align:left; padding:8px 12px; border-bottom:1px solid var(--line2);
}
.row:hover{background:var(--surface)}
.row[aria-current="true"]{background:var(--ai); color:#F7F6F2}
.row[aria-current="true"] .rsub{color:#BCCDD3}
.rname{font-size:13.5px; font-weight:500}
.rsub{font-size:10.5px; color:var(--ink3); font-family:var(--num); letter-spacing:.05em}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.empty{padding:24px 14px; color:var(--ink3); font-size:12.5px}

/* ---------- content ---------- */
section.stage{overflow-y:auto; min-height:0; padding:22px 26px 60px}
.stage-head{margin-bottom:18px}
.stage-head h1{margin:4px 0 0; font-size:26px; letter-spacing:.02em; font-weight:700}
.stage-head .meta{margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink2); font-family:var(--num); letter-spacing:.05em}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:16px}
.card{background:var(--surface); border:1px solid var(--line); padding:15px 16px 17px}
.card > h2{margin:0 0 12px; font:700 11px/1 var(--num); letter-spacing:.14em; text-transform:uppercase; color:var(--ink2)}
.card.wide{grid-column:1/-1}

/* dummy overlay */
.dummy{position:relative}
.dummy::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(190,79,45,.07) 9px 18px);
}
.dummy-tag{
  position:absolute; top:0; right:0; z-index:2;
  background:var(--kawara); color:#fff; padding:2px 7px;
  font:700 9px/1.5 var(--num); letter-spacing:.14em;
}

/* badges */
.badges{display:flex; flex-wrap:wrap; gap:6px}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  border:1px solid var(--line); background:var(--surface2);
  padding:4px 9px; font-size:11.5px; line-height:1.4;
}
.badge .k{font:700 9.5px/1 var(--num); letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}
.badge.on{border-color:var(--basho); background:#E9EFE6; color:#2C4A2B}
.badge.plan{border-color:var(--ai2); background:#E4EDF0; color:#154655}
.badge.off{border-color:var(--line); background:var(--surface2); color:var(--ink3)}
.badge.tbd{border-color:var(--sand); background:#EEEAE2; color:#6B6154}

/* stat strip */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:1px; background:var(--line2)}
.stat{background:var(--surface); padding:10px 12px}
.stat .v{font:700 24px/1.15 var(--num); font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px; font-weight:400; color:var(--ink2); margin-left:2px}
.stat .l{font-size:10.5px; color:var(--ink3); margin-top:1px; line-height:1.4}
.stat .v.na{color:var(--ink3); font-size:15px; font-weight:400}
.stat .l .yr{display:inline-block; margin-top:2px; font-size:10px; color:var(--ink2);
  border:1px solid var(--line); background:var(--surface2); padding:0 5px; line-height:1.6}
.stat .l .yr.unk{color:#6E2E19; border-color:var(--kawara); background:#F6EAE4}

/* 原因未確認の断りなど、読み違えを防ぐための注意書き */
.caveat{margin-top:10px; border:1px solid var(--kawara); border-left-width:4px;
  background:#F6EAE4; color:#6E2E19; padding:7px 10px; font-size:11.5px; line-height:1.6}
.caveat b{font-family:var(--num); letter-spacing:.06em}

/* text blocks */
dl.kv{margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px}
dl.kv dt{font:700 9.5px/1.7 var(--num); letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); white-space:nowrap}
dl.kv dd{margin:0}
dl.kv dd.q{color:var(--ink3)}

table.tbl{width:100%; border-collapse:collapse; font-size:12px}
table.tbl th{
  text-align:left; font:700 9.5px/1.6 var(--num); letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink3); border-bottom:1px solid var(--line); padding:5px 8px 5px 0; white-space:nowrap;
}
table.tbl td{border-bottom:1px solid var(--line2); padding:6px 8px 6px 0; vertical-align:top}
table.tbl td.n{font-family:var(--num); font-variant-numeric:tabular-nums; text-align:right; padding-right:14px}

/* ---------- 横棒グラフ一覧（このサイトの一覧表現） ---------- */
.blockwrap{border:1px solid var(--line); background:var(--surface); padding:14px 15px 16px}
.blockhead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.blockhead h2{margin:0; font:700 11px/1 var(--num); letter-spacing:.14em; text-transform:uppercase; color:var(--ink2)}
.blockhead select{
  font:400 12px var(--jp); padding:3px 6px; background:var(--surface2);
  border:1px solid var(--line); color:var(--ink);
}
.blockhead label{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink3)}

.bars{display:flex; flex-direction:column}
.bar-row{
  display:grid; grid-template-columns:8.5em 1fr 6em; align-items:center; gap:10px;
  width:100%; text-align:left; padding:5px 8px 5px 5px;
  border-bottom:1px solid var(--line2); border-left:3px solid transparent;
}
/* 値の右に基準年などを併記する一覧（推定空家数）と、字の一覧はもう1列使う */
.bars.meta .bar-row{grid-template-columns:8.5em 1fr 6em 7.5em}
.bars.aza .bar-row{grid-template-columns:10em 1fr 6.5em 7em}
.bar-row:hover{background:var(--surface2)}
.bar-row:hover .bar-name{color:var(--ai)}
/* 最終確認状況が未確認の市町村。トラックの点線は「回答なし」に使っているので、
   混同しないよう行の左端で示す。 */
.bar-row.unconf{border-left-style:dashed; border-left-color:var(--sand)}
.bar-name{font-size:12.5px; line-height:1.35; overflow-wrap:anywhere}

/* トラック。「回答なし」「実測0」「正の値」の描き分けはこの中だけで完結させる。 */
.bar-track{position:relative; display:block; height:14px}
.bar-fill{position:absolute; left:0; top:0; bottom:0; min-width:2px}
/* 実測のゼロ。バーは無いが、原点に実線のマークを置く（形はあるが量がゼロ） */
.bar-zero{position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ink3)}
/* 回答なし。値が分かっていないので、原点のマークすら置かず点線のトラックだけにする */
.bar-none{position:absolute; left:0; right:0; top:50%; height:0; border-top:1.5px dotted var(--line)}

.bar-val{
  font:700 12px/1.2 var(--num); font-variant-numeric:tabular-nums;
  text-align:right; white-space:nowrap;
}
.bar-val small{font-size:10px; font-weight:400; color:var(--ink2); margin-left:1px}
.bar-val.na{font:400 11px/1.2 var(--jp); color:var(--ink3)}
.bar-val.zero{font-weight:400; color:var(--ink2)}
.bar-meta{font-size:10.5px; color:var(--ink3); white-space:nowrap; text-align:right}
.bar-yr{
  font:400 10px/1.6 var(--num); color:var(--ink2);
  border:1px solid var(--line); background:var(--surface2); padding:0 5px; white-space:nowrap;
}
.bar-yr.unk{color:#6E2E19; border-color:var(--kawara); background:#F6EAE4}
.bar-dir{font:400 10.5px/1.2 var(--num); font-variant-numeric:tabular-nums;
  white-space:nowrap; text-align:right}
/* 「回答なし」をまとめた区切り。並べ替えても空欄の行が先頭を埋めないようにする。 */
.bar-sep{
  display:flex; align-items:center; gap:9px; margin:12px 0 2px;
  font:700 9.5px/1 var(--num); letter-spacing:.12em; color:var(--ink3);
}
.bar-sep::after{content:""; flex:1; border-top:1px solid var(--line2)}

/* 注記に埋め込む見本。行と同じ barTrack() で描いて、文言と実際の描画がズレないようにする。 */
.lgdbar{display:inline-block; width:30px; height:12px; vertical-align:-2px; margin:0 2px 0 6px}
.lgdbar .bar-track{height:100%}
.lgdunconf{
  display:inline-block; width:16px; height:12px; vertical-align:-2px; margin:0 2px 0 6px;
  border-left:3px dashed var(--sand); background:var(--surface2);
}

/* ---------- map slot ---------- */
.mapslot{
  border:1px dashed var(--ai2); background:#E6EDEF; padding:16px;
  display:flex; gap:14px; align-items:flex-start; font-size:12.5px; line-height:1.65;
}
.mapslot .ico{flex:0 0 auto; color:var(--ai)}
.mapslot code{font-family:var(--num); background:var(--surface); padding:1px 5px; border:1px solid var(--line)}

/* ---------- map (MapLibre) ---------- */
#map{height:480px; border:1px solid var(--line); background:var(--ground)}
/* 市町村ページの地図（その市町村の字だけ）。県全体より低くする。 */
#map[data-scope]{height:380px}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--ai2)}
/* 市町村ページの地図のホバー吹き出し。遷移できない理由を出す .mapnotice（赤瓦色の警告）
   とは役割が違うので、混同しないよう地の濃色だけの落ち着いた見た目にする。 */
.maptip .maplibregl-popup-content{
  background:var(--ink); color:#F7F6F2; border-radius:0; padding:5px 9px;
  font:500 11.5px/1.5 var(--jp); box-shadow:0 1px 5px rgba(21,31,35,.28);
}
.maptip .maplibregl-popup-tip{display:none}
.mapnotice .maplibregl-popup-content{
  background:var(--surface); border:1px solid var(--kawara); border-left-width:4px;
  border-radius:0; padding:10px 24px 11px 12px; font:400 11.5px/1.6 var(--jp); color:var(--ink);
}
.mapnotice .maplibregl-popup-content b{color:#6E2E19}
.mapnotice .maplibregl-popup-tip{border-top-color:var(--kawara); border-bottom-color:var(--kawara)}

.note{font-size:11.5px; color:var(--ink3); line-height:1.6; margin-top:10px}
.chartnote{font-size:11px; color:var(--ink3); margin-top:6px}

@media (max-width:860px){
  main{grid-template-columns:1fr; grid-template-rows:auto 1fr}
  aside{border-right:0; border-bottom:1px solid var(--line)}
  .list{max-height:34vh}
  .banner{margin-left:0}
}
/* 狭い画面では戻るボタンを1行目に、パンくずをその下の行全体に置く。 */
@media (max-width:640px){
  header.top{gap:10px}
  .backall{order:2}
  nav.crumb{order:3; width:100%}
  .banner{order:4}
  .bars .bar-row{grid-template-columns:6.5em 1fr 5.5em; gap:7px}
  .bars.meta .bar-row{grid-template-columns:6.5em 1fr 5.5em 6.5em}
  .bars.aza .bar-row{grid-template-columns:7.5em 1fr 5.5em 6em}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">沖縄 <span>地域データアトラス</span></div>
    <button class="backall" id="backall" data-go="pref"><span class="ar">←</span>沖縄県全体に戻る</button>
    <nav class="crumb" id="crumb" aria-label="階層"></nav>
    <div class="banner">
      <div>
        <b>データ状態</b><br>
        <span id="datastate">施策・空き家、市町村の人口推移・年齢構成、字の人口推移は<strong>実データ</strong>です。</span>
        <a href="quality.html">データの品質と限界</a>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <div class="searchbox">
        <input id="q" type="search" placeholder="市町村・字を検索" autocomplete="off" aria-label="市町村・字を検索">
        <div class="hint" id="qhint"></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="stage" id="stage" tabindex="-1"></section>
  </main>
</div>

<script>
const DATA = /*__DATA__*/;

/* ============================ サンプル人口データ ============================
   実データが入るまでのプレースホルダ。決定論的な擬似乱数で生成し、
   画面上は必ず斜線＋「ダミー」タグ付きで表示する。字の年齢構成が対象
   （令和2年国勢調査 小地域集計はe-Stat API経由での取得元が見つからず、
   Phase 5で改めて扱う）。
   市町村の人口推移・年齢構成、字の人口推移は実データに切り替え済み。       */
function seeded(str){let h=2166136261;for(const c of str)h=(h^c.charCodeAt(0))*16777619>>>0;
  return()=>{h=(h*1103515245+12345)>>>0;return h/4294967296;};}
const AGES=["0-4","5-9","10-14","15-19","20-24","25-29","30-34","35-39","40-44",
            "45-49","50-54","55-59","60-64","65-69","70-74","75-79","80-84","85+"];

/** 字の年齢構成が実データに対応できなかった理由（data/aza_census_crosswalk.csv のstatus）。
 *「対象外」系は米軍基地関連などの推測であり、公式な確証（total_of_scope）が
 *  取れるまでは必ず「可能性・推定」と書く。 */
const AGE_STATUS_TEXT={
  suppressed:{tag:"秘匿処理",
    note:"令和2年国勢調査 小地域集計では、この字は人口が少なく近隣の町丁・字に合算されており（秘匿処理）、年齢構成を復元できません。下は実データではなくサンプル値です。"},
  possibly_out_of_scope:{tag:"対象外の可能性（推定）",
    note:"この字に該当する国勢調査 小地域集計の町丁・字が見つからず、名前のある区域の合計だけで市町村計と一致することから、米軍基地関連の区域など国勢調査の対象区域に含まれていない可能性があります。総務省統計局による公式な説明は確認できておらず、推定にとどまります。下は実データではなくサンプル値です。"},
  out_of_scope:{tag:"対象外（確定）",
    note:"この字は国勢調査 小地域集計の対象区域に含まれないことが確認されています。下は実データではなくサンプル値です。"},
  unmatched:{tag:"未対応",
    note:"令和2年国勢調査 小地域集計の町丁・字区分と、この字の名称が一致しないため対応できていません（新設・字名の表記差など）。下は実データではなくサンプル値です。"},
};

/** 字の年齢構成（令和2年国勢調査 小地域集計が入るまでのダミー）。人口推移とは無関係。 */
function demoAzaPyramid(seedKey,base){
  const rr=seeded(seedKey);
  return AGES.map((a,k)=>{
    const d=Math.exp(-Math.pow((k-8)/9,2));
    const m=Math.round(Math.max(20,base)*d*(.03+rr()*.008));
    return{age:a,male:m,female:Math.round(m*(1+rr()*.18))};
  });
}

/* ============================ 指標 ============================ */
/** unconfirmed: その指標の出どころが「最終確認状況＝未確認」かどうか。
 *  未確認だと令和6年度以前の回答が残っている可能性がある。出どころごとに
 *  判定する（総人口は国勢調査なので、調査票の確認状況とは無関係＝常にfalse）。 */
const INDICATORS={
  // 既定の指標。41市町村すべてに値があり基準日も揃っているので最初に出す。
  // 出どころが国勢調査なので、ヒアリング調査の確認状況とは無関係。
  pop_total:{label:"総人口（令和7年国勢調査 速報値）",
    get:m=>m.pop&&m.pop.trend[m.pop.trend.length-1].pop, unit:"人", real:true,
    unconfirmed:()=>false},
  // 「R7調査」とは書かない。ヒアリング調査の実施年であって、数値そのものの
  // 基準年ではない（回答10件のうち令和6年度が3件、令和7年度が1件、残り6件は不明）。
  // 基準年は市町村ページで1件ずつ出す。
  estimated_vacant:{label:"推定空家数（ヒアリング調査・回答のみ）",
    get:m=>m.akiya&&m.akiya.estimated_vacant, unit:"件", real:true,
    unconfirmed:m=>m.akiya?m.akiya.confirmed===false:false},
  bank_registered_total:{label:"空き家バンク累計登録",
    get:m=>m.akiya&&m.akiya.bank_registered_total, unit:"件", real:true,
    unconfirmed:m=>m.akiya?m.akiya.confirmed===false:false},
  // ?? であって || ではない。0件は「回答なし」ではなく実測のゼロ（41市町村中21件）。
  housing_count:{label:"定住促進住宅の物件数",
    get:m=>m.housing.length??null, unit:"件", real:true,
    unconfirmed:m=>m.housing.some(h=>h.confirmed===false)},
};

/* ============================ 索引の構築 ============================ */
/** 字ID。市町村コード＋字名で作る（同名の字が別市町村にあっても衝突しない）。 */
const azaId=(muniCode,azaName)=>muniCode+"／"+azaName;

const azaAgeKey=(muni,aza)=>muni+"／"+aza;
const AZA_AGE=new Map(DATA.population_aza_age.map(e=>[azaAgeKey(e.municipality,e.aza),e]));

const MUNI=DATA.municipalities.map(m=>{
  const policy=DATA.policy.find(p=>p.code===m.code)||null;
  const akiya=DATA.akiya.find(a=>a.code===m.code)||null;
  const housing=DATA.housing.filter(h=>h.code===m.code);
  const aza=DATA.population_aza.filter(z=>z.municipality===m.name).map(z=>{
    const age=AZA_AGE.get(azaAgeKey(m.name,z.aza));
    const ageStatus=age?age.status:"unmatched";
    return{
      id:azaId(m.code,z.aza), name:z.aza,
      trend:z.trend.map(t=>({year:t.year,date:t.date,pop:t.population,households:t.households})),
      ageStatus,
      pyramid:ageStatus==="matched"?age.pyramid:demoAzaPyramid(m.code+"/"+z.aza,z.trend[z.trend.length-1].population),
    };
  });
  const pm=DATA.population_muni.find(p=>p.code===m.code)||null;
  const pop=pm&&{
    pyramidYear:pm.pyramid_year, pyramid:pm.pyramid,
    trend:pm.trend.map(t=>({year:t.year,date:t.date,pop:t.population,
      households:t.households,boundary:t.boundary,provisional:t.provisional})),
  };
  return{...m,policy,akiya,housing,aza,pop};
});
const INDEX=[];
for(const m of MUNI){
  INDEX.push({kind:"muni",code:m.code,label:m.name,sub:m.code,muni:m});
  for(const a of m.aza)
    INDEX.push({kind:"aza",code:a.id,label:a.name,sub:m.name,muni:m,aza:a});
}

/* ============================ 描画ヘルパ ============================ */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"—":n.toLocaleString("ja-JP");

/** 一覧の横棒1本ぶんのトラック。CLAUDE.md原則3のとおり「回答なし」と「実測0」を
 *  見た目で必ず分ける。
 *   v == null → 回答なし。点線のトラックだけ（値が分かっていないので原点の印も置かない）
 *   v === 0   → 実測ゼロ。原点に実線の縦マーク（形はあるが量がゼロ）
 *   v > 0     → max に対する割合ぶんのバー
 *  凡例の見本もこの関数で描くこと（文言と実際の描画がズレないようにするため）。 */
function barTrack(v,max,color){
  if(v==null)return `<span class="bar-track"><span class="bar-none"></span></span>`;
  if(v===0)return `<span class="bar-track"><span class="bar-zero"></span></span>`;
  const w=Math.max(1.5,Math.min(100,v/(max||1)*100));
  return `<span class="bar-track"><span class="bar-fill" style="width:${w.toFixed(2)}%;background:${color}"></span></span>`;
}
/** バーの右に出す値。0を「回答なし」と読ませないため、実測のゼロには必ず「（実測）」を付ける。 */
function barValue(v,unit){
  if(v==null)return `<span class="bar-val na">回答なし</span>`;
  if(v===0)return `<span class="bar-val zero">0<small>（実測）</small></span>`;
  return `<span class="bar-val">${fmt(v)}<small>${esc(unit)}</small></span>`;
}
/** 一覧の並び替え。null（回答なし・人口不明）は昇順・降順のどちらでも必ず末尾に
 *  まとめる（昇順で空欄の行が先頭を埋めると一覧が読めなくなるため）。もとの並び
 *  （市町村コード順など）のときは位置を動かさないので blanks は空で返す。 */
function orderRows(items,valueOf,mode){
  if(mode!=="desc"&&mode!=="asc")return{ranked:items.slice(),blanks:[]};
  const ranked=items.filter(i=>valueOf(i)!=null);
  const blanks=items.filter(i=>valueOf(i)==null);
  ranked.sort((a,b)=>mode==="desc"?valueOf(b)-valueOf(a):valueOf(a)-valueOf(b));
  return{ranked,blanks};
}

function pyramidSVG(rows){
  if(!rows||!rows.length)return `<p class="note">データなし</p>`;
  // 年少層を下に置く（人口ピラミッドの慣習）。データ側は市町村・字・サンプル値の
  // いずれも 0-4 → 85+ の昇順で渡ってくるので、描画のときだけ逆順にする。
  // 3経路ともこの関数を通るので、ここだけで向きが揃う。
  const ord=rows.slice().reverse();
  const W=440,H=270,mid=W/2,gap=34,bh=(H-24)/ord.length-1.6;
  const max=Math.max(...ord.map(r=>Math.max(r.male,r.female)))||1;
  const sc=(mid-gap/2-14)/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="年齢5歳階級別の男女人口（下が年少）">`;
  ord.forEach((r,i)=>{
    const y=12+i*((H-24)/ord.length);
    s+=`<rect x="${mid-gap/2-r.male*sc}" y="${y}" width="${r.male*sc}" height="${bh}" fill="var(--ai)" opacity=".82"/>`;
    s+=`<rect x="${mid+gap/2}" y="${y}" width="${r.female*sc}" height="${bh}" fill="var(--kawara)" opacity=".72"/>`;
    // ラベルは1つおきだが、最下段（0-4）と最上段（85+）は必ず出す。
    if(i===0||i===ord.length-1||(ord.length-1-i)%2===0)
      s+=`<text x="${mid}" y="${y+bh*.82}" text-anchor="middle" font-size="7.6" font-family="Roboto Condensed" fill="var(--ink3)">${r.age}</text>`;
  });
  s+=`<text x="${mid-gap/2-4}" y="8" text-anchor="end" font-size="8.4" font-family="Roboto Condensed" fill="var(--ai)">男</text>`;
  s+=`<text x="${mid+gap/2+4}" y="8" font-size="8.4" font-family="Roboto Condensed" fill="var(--kawara)">女</text></svg>`;
  return s;
}

/** "YYYY-MM-DD" を小数年に変換する。基準日が年途中でずれている系列
 *（住基データの2011〜2013年は3月31日、2014年以降は1月1日）を、横軸の
 *間隔にそのまま反映させるため。date が無い行（市町村レイヤーのダミー
 *データなど）は年番号をそのまま使う。 */
function decimalYear(dateStr){
  const [y,m,d]=dateStr.split("-").map(Number);
  const start=Date.UTC(y,0,1),end=Date.UTC(y+1,0,1),cur=Date.UTC(y,m-1,d);
  return y+(cur-start)/(end-start);
}
function trendSVG(rows,label){
  const W=440,H=190,L=44,R=10,T=14,B=26;
  const xval=r=>r.date?decimalYear(r.date):r.year;
  const known=rows.filter(r=>r.pop!=null);
  if(!known.length)return `<p class="note">データなし</p>`;
  const xs=known.map(xval),ys=known.map(r=>r.pop);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const y1=Math.max(...ys)*1.06,y0=Math.min(...ys)*.9;
  const px=v=>L+(W-L-R)*((v-x0)/((x1-x0)||1));
  const py=v=>T+(H-T-B)*(1-(v-y0)/((y1-y0)||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for(let k=0;k<=2;k++){
    const v=y0+(y1-y0)*k/2,y=py(v);
    s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line2)"/>`;
    s+=`<text x="${L-6}" y="${y+3}" text-anchor="end" font-size="8.4" font-family="Roboto Condensed" fill="var(--ink3)">${Math.round(v).toLocaleString()}</text>`;
  }
  // 合併前の旧市町村を合算した年（boundary==="reconciled"）。値そのものは国勢調査の
  // 実測値で、それを現在の市域に含まれる旧市町村ぶん足し合わせたもの（推計ではない）。
  // ただし当時の市域は今と違うので、区間を破線・薄い色にして区別する。
  for(let i=0;i<known.length-1;i++){
    const a=known[i],b=known[i+1],reconciled=a.boundary==="reconciled"||b.boundary==="reconciled";
    s+=`<line x1="${px(xval(a)).toFixed(1)}" y1="${py(a.pop).toFixed(1)}" x2="${px(xval(b)).toFixed(1)}" y2="${py(b.pop).toFixed(1)}"
      stroke="var(--ai)" stroke-width="2"${reconciled?' stroke-dasharray="3 3" opacity=".5"':""}/>`;
  }
  known.forEach(r=>{
    const rec=r.boundary==="reconciled";
    const bits=[r.date?`${r.year}年（${r.date}現在）`:`${r.year}年`,`${fmt(r.pop)}人`];
    if(rec)bits.push("旧市町村の実測値を合算（当時の市域は現在と異なる）");
    if(r.provisional)bits.push("速報値・年齢別データなし");
    s+=`<circle cx="${px(xval(r))}" cy="${py(r.pop)}" r="${rec?2.2:2.6}"
      fill="${rec?"var(--surface)":"var(--ai)"}" stroke="var(--ai)" stroke-width="${rec?1.3:0}"
      opacity="${rec?.75:1}"><title>${esc(bits.join(" ／ "))}</title></circle>`;});
  rows.forEach((r,i)=>{if(i%2===0||i===rows.length-1)
    s+=`<text x="${px(xval(r))}" y="${H-8}" text-anchor="middle" font-size="8.4" font-family="Roboto Condensed" fill="var(--ink3)">${r.year}</text>`;});
  return s+"</svg>";
}

/** 選択式の値を色分けバッジに。 */
function badge(key,val){
  if(!val)return `<span class="badge off"><span class="k">${esc(key)}</span>未回答</span>`;
  const v=val.replace(/（.*?）/g,"").trim();
  let cls="tbd";
  if(/^(策定済み|設置済み|開設済み|設けている|指定している|ある|行っている|すでに取り組んでいる|あり)/.test(v))cls="on";
  else if(/(今後|予定$|検討)/.test(v)&&!/(予定はない)/.test(v))cls="plan";
  else if(/(予定はない|していない|実施していない|ない$|指定しない)/.test(v))cls="off";
  return `<span class="badge ${cls}"><span class="k">${esc(key)}</span>${esc(v)}</span>`;
}

/** 住基（字別人口）の2019→2020だけ、県計が他の年より大きく伸びている。
 *  原因が確認できていないので「2020年に急増した」と読まれないよう、住基の推移を
 *  見せている場所には必ずこの断りを出す。原因が判明したら文言を差し替えること。 */
const JUKI_2020_CAVEAT=`<p class="caveat"><b>注意</b>　2019→2020年にかけて、県全体で
  他の年より大きな増加（約1.6%。他の年はおおむね±0.7%以内）が出ています。
  <strong>原因を確認中で、実際の人口の動きを表しているとは限りません。</strong>
  この区間の増減はそのまま読まないでください。</p>`;

/* ============================ 画面 ============================ */
/** sort は一覧ごとに別で持つ。指標や市町村を切り替えても並び順を保持するため。
 *  pref の既定が "code"（市町村コード順）なのは、推定空家数のように基準年が
 *  混在する指標で、既定を値順にすると年度をまたいだ順位表として読まれるため。 */
let view={layer:"pref",code:null,aza:null,indicator:"pop_total",
          sort:{pref:"code",aza:"desc"}};
const PREF_SORTS={code:"市町村コード順",desc:"値の大きい順",asc:"値の小さい順"};
const AZA_SORTS={desc:"人口の多い順",asc:"人口の少ない順",orig:"もとの並び"};
const sortOptions=(opts,cur)=>Object.entries(opts).map(([k,v])=>
  `<option value="${k}" ${k===cur?"selected":""}>${esc(v)}</option>`).join("");

function render(){
  renderCrumb();renderList();
  // 地図はDOMの外側でWebGLコンテキスト等を持つため、innerHTMLで
  // #map ごと消してしまう前に明示的に破棄する（コンテナが外れた後に
  // remove()を呼ぶと内部で例外になりうるため）。
  if(mapInstance){try{mapInstance.remove();}catch(e){/* noop */}mapInstance=null;mapPopup=null;mapTip=null;}
  const st=document.getElementById("stage");
  st.innerHTML = view.layer==="pref"?prefView()
               : view.layer==="muni"?muniView(find(view.code))
               : azaView(find(view.code),view.aza);
  st.scrollTop=0;
  bindStage();
}
const find=code=>MUNI.find(m=>m.code===code);

function renderCrumb(){
  const c=document.getElementById("crumb");
  const m=view.code?find(view.code):null;
  // 県レイヤーでも戻るボタンは消さず無効表示にする。消すとヘッダーの幅が変わり、
  // 階層を移動するたびにパンくずの位置がずれるため。
  const back=document.getElementById("backall");
  const atPref=view.layer==="pref";
  back.setAttribute("aria-disabled",String(atPref));
  back.tabIndex=atPref?-1:0;
  let h=view.layer==="pref"
    ?`<span class="cur">沖縄県 41市町村</span>`
    :`<button data-go="pref">沖縄県</button>`;

    ?`<span class="cur">${esc(m.name)}</span>`
    :`<button data-go="muni" data-code="${m.code}">${esc(m.name)}</button>`);

    const a=m.aza.find(x=>x.id===view.aza);

function renderList(){
  const q=document.getElementById("q").value.trim();
  const hits=(q?INDEX.filter(i=>i.label.includes(q)||i.sub.includes(q)):
              INDEX.filter(i=>i.kind==="muni")).slice(0,400);
  document.getElementById("qhint").textContent = q
    ? `${hits.length}件（市町村＋字を横断検索）`
    : "字も同じ欄から検索できます";
  const el=document.getElementById("list");
  if(!hits.length){el.innerHTML=`<div class="empty">該当なし。市町村名か字名の一部を入力してください。</div>`;return;}
  el.innerHTML=hits.map(i=>{
    const cur=i.kind==="muni"?(view.layer==="muni"&&view.code===i.code)
                             :(view.layer==="aza"&&view.aza===i.code);
    const tag=i.kind==="aza"?`<span class="dot" style="background:var(--sand)"></span>`:"";
    return `<button class="row" aria-current="${cur}" data-kind="${i.kind}" data-code="${i.code}" data-muni="${i.muni.code}">
      <span class="rname">${tag}${esc(i.label)}</span>
      <span class="rsub">${esc(i.sub)}</span></button>`;
  }).join("");
}

function prefView(){
  const ind=INDICATORS[view.indicator];
  // 回答あり＝nullでないもの。実測0は「回答あり」に数える（0と未回答は別物）。
  const all=MUNI.map(m=>ind.get(m));
  const vals=all.filter(v=>v!=null);
  const zeros=vals.filter(v=>v===0).length;
  const max=Math.max(...vals,1);
  const answered=vals.length;
  // 最終確認状況が未確認の市町村は、値そのものが古い可能性があるので行に印を付ける。
  // トラックの点線は「回答なし」に使っているので、印は行の左端の破線で出す。
  const unconf=MUNI.filter(m=>ind.unconfirmed(m)).length;
  // 推定空家数だけは市町村ごとに数値の基準年が違う。「R7調査」はヒアリングの実施年
  // であって数値の基準年ではないので、行ごとに基準年を出し、備考に年の記載が無い
  // 回答は「基準年不明」と明示する（CLAUDE.md「既知の未完了」参照）。
  const hasYear=view.indicator==="estimated_vacant";
  const yearTag=m=>{
    const a=m.akiya;
    if(!a||a.estimated_vacant==null)return "";
    return a.estimated_vacant_base_year
      ?`<span class="bar-yr">基準 ${esc(a.estimated_vacant_base_year)}</span>`
      :`<span class="bar-yr unk">基準年不明</span>`;
  };
  const row=m=>{
    const v=ind.get(m);
    const u=ind.unconfirmed(m);
    const state=v==null?"回答なし":v===0?"0（実測）":fmt(v)+ind.unit;
    return `<button class="bar-row${u?" unconf":""}" data-kind="muni" data-code="${m.code}"
      title="${esc(m.name)}｜${esc(ind.label)}: ${esc(state)}${u?"｜R7回答 未確認（R6以前の値が残っている可能性）":""}">
      <span class="bar-name">${esc(m.name)}</span>
      ${barTrack(v,max,"var(--ai)")}
      ${barValue(v,ind.unit)}
      ${hasYear?`<span class="bar-meta">${yearTag(m)}</span>`:""}</button>`;
  };
  const {ranked,blanks}=orderRows(MUNI,m=>ind.get(m),view.sort.pref);
  const rows=ranked.map(row).join("")
    +(blanks.length?`<div class="bar-sep">回答なし ${blanks.length}市町村</div>`+blanks.map(row).join(""):"");
  return `
  <div class="stage-head">
    <div class="eyebrow">Layer 1 — 市町村</div>
    <h1>沖縄県 41市町村</h1>
    <div class="meta"><span>移住定住・空き家 取り組み状況調査（令和7年度）</span><span>定住促進住宅 ${DATA.housing.length}件</span></div>
  </div>
  <div class="blockwrap">
    <div class="blockhead">
      <h2>指標で見る</h2>
      <select id="indsel">${Object.entries(INDICATORS).map(([k,v])=>
        `<option value="${k}" ${k===view.indicator?"selected":""}>${esc(v.label)}</option>`).join("")}</select>
      <label>並び順 <select id="sortsel">${sortOptions(PREF_SORTS,view.sort.pref)}</select></label>
      <span class="eyebrow">${ind.real?`回答あり ${answered}/41${zeros?`（うち実測0が${zeros}）`:""}`:"サンプル値"}</span>
    </div>
    <div class="bars${hasYear?" meta":""}">${rows}</div>
    <p class="note">バーの長さが指標値（全長＝${fmt(max)}${esc(ind.unit)}）。
      <span class="lgdbar">${barTrack(null,1)}</span><b>点線のトラック</b>＝回答なし（値が分かっていない）、
      <span class="lgdbar">${barTrack(0,1)}</span><b>原点の実線マーク</b>＝実測のゼロ。この2つは別のものとして扱っています。
      ${unconf?`<span class="lgdunconf"></span><b>行の左端が破線</b>＝最終確認状況が未確認の${unconf}市町村。
        令和6年度以前の回答が残っている可能性があります。`:""}
      ${hasYear?`右端は<strong>その数値の基準年</strong>です。指標名の「ヒアリング調査」は調査の実施年（令和7年度）であって、
        数値の基準年ではありません。基準年の異なる市町村どうしを並べて比較しないでください。`:""}
      クリックで市町村レイヤーへ。</p>
  </div>
  <div class="grid2" style="margin-top:16px">
    <div class="card wide">
      <h2>地図で見る</h2>
      <div id="map" role="img" aria-label="沖縄県の市町村・字の境界地図"></div>
      <p class="chartnote">出典：e-Stat 統計地理情報システム 令和2年国勢調査 小地域（町丁・字等）（JGD2000）。市町村ポリゴンは同じデータをCITYコードでdissolveして作成。ズームアウトで市町村、ズームインで字の境界が見えます。クリックで各レイヤーに遷移。<br>
      <strong>境界は国勢調査の調査区をもとにしているため、住居表示上の町丁・字と一致しないことがあります。</strong>また境界は令和2年（2020年）時点のもので、人口データ（令和7年住民基本台帳）より古いため、2020年より後に新設された丁目には対応する区域がありません。</p>
    </div>
  </div>`;
}

function muniView(m){
  const d=m.pop||{pyramid:null,pyramidYear:null,trend:[]}, p=m.policy||{}, a=m.akiya||{};
  const reconciledYears=d.trend.filter(t=>t.boundary==="reconciled").map(t=>t.year);
  // バー長はその市町村内の最大人口を基準にする（市町村をまたいだ比較はしない）。
  const azaLast=z=>z.trend[z.trend.length-1].pop;

/* ============================ 地図 ============================ */
/** 境界ポリゴンの町丁字名（S_NAME）と、住基側の字表示名を突合するためのキー。
 *  scripts/fetch_aza_census.py の match_key() と同じ考え方（丁目の漢数字を
 *  算用数字に揃え、先頭の「字」は完全一致で見つからないときだけ落とす）を
 *  クライアント側でも使う。境界ポリゴン専用のゆるい突合であり、
 *  data/aza_census_crosswalk.csv のような永続的な対応表ではない。 */
const MAP_KANJI_DIGIT={"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function mapKanjiNumToInt(s){
  if(s==="十")return 10;
  if(s.includes("十")){
    const [left,right]=s.split("十");
    const tens=left?MAP_KANJI_DIGIT[left]:1, ones=right?MAP_KANJI_DIGIT[right]:0;
    if((left&&tens==null)||(right&&ones==null))return null;
    return tens*10+ones;
  }
  return MAP_KANJI_DIGIT[s];
}
function mapCanonicalChome(name){
  const m=String(name||"").match(/^(.*?)([一二三四五六七八九十]+)丁目$/);
  if(!m)return name;
  const n=mapKanjiNumToInt(m[2]);
  return n==null?name:`${m[1]}${n}丁目`;
}
const mapStripJi=s=>s.startsWith("字")?s.slice(1):s;
/** 境界ポリゴンのS_NAMEから、その市町村内の住基側の字（表示名）を探す。
 *  完全一致を優先し、「字」を落とした形は一意に決まるときだけ使う
 *  （那覇市の「字上之屋」と「上之屋」のように別実体が両方あると衝突するため）。
 *  見つからなければnull（=クリックしても遷移しない）。 */
function matchAzaName(m,sname){
  const raw=mapCanonicalChome(sname);
  const exact=m.aza.find(a=>mapCanonicalChome(a.name)===raw);
  if(exact)return exact.name;
  const strippedTarget=mapStripJi(raw);
  const candidates=m.aza.filter(a=>mapStripJi(mapCanonicalChome(a.name))===strippedTarget);
  return candidates.length===1?candidates[0].name:null;
}

/** タイルに載っているポリゴンの外接矩形。タイル境界で分割されて複数の地物として
 *  返ることがあるので全件を舐める。1件も無ければ null。 */
function featureBounds(feats){
  let w=Infinity,s=Infinity,e=-Infinity,n=-Infinity;
  const walk=c=>{
    if(typeof c[0]==="number"){
      if(c[0]<w)w=c[0];
      if(c[0]>e)e=c[0];
      if(c[1]<s)s=c[1];
      if(c[1]>n)n=c[1];
      return;
    }
    for(const x of c)walk(x);
  };
  for(const f of feats)if(f.geometry&&f.geometry.coordinates)walk(f.geometry.coordinates);
  return isFinite(w)&&isFinite(s)&&isFinite(e)&&isFinite(n)?[[w,s],[e,n]]:null;
}
/* 沖縄県の全域（与那国島から南北大東島まで）。市町村ページの地図は、まずこの範囲で
   読み込んでから該当市町村に寄せる。muniレイヤーは41件・-Z0 -z10 なので低ズームでも
   全件がタイルに載り、離島を取りこぼさない。 */
const OKINAWA_BOUNDS=[[122.9,24.0],[131.4,27.9]];

let mapInstance=null, mapProtocolRegistered=false;
/** scopeCode を渡すと、その市町村の字だけを塗った地図になる（市町村ページ用）。
 *  省略すると県全体（市町村→字をズームで切り替え）。 */
function initMap(scopeCode){
  const el=document.getElementById("map");
  if(!el)return;
  if(typeof maplibregl==="undefined"||typeof pmtiles==="undefined"){
    el.outerHTML=`<div class="mapslot"><div>地図ライブラリを読み込めませんでした（オフライン、または広告ブロッカー等でCDNがブロックされている可能性があります）。</div></div>`;
    return;
  }
  if(!mapProtocolRegistered){
    const protocol=new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles",protocol.tile);
    mapProtocolRegistered=true;
  }
  const scoped=!!scopeCode;
  const scopeMuni=scoped?find(scopeCode):null;
  // PREF・CITYの型（文字列／数値）に依存しないよう、連結して市町村コードと比べる。
  const scopeFilter=scoped
    ?["==",["concat",["to-string",["get","PREF"]],["to-string",["get","CITY"]]],scopeCode]
    :null;
  const cv=name=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const style={
    version:8,
    sources:{okinawa:{type:"vector",url:"pmtiles://tiles/okinawa.pmtiles"}},
    layers:scoped?[
      {id:"bg",type:"background",paint:{"background-color":cv("--ground")}},
      // 周辺の市町村。位置の手がかりとして薄く残すだけで、操作の対象にはしない。
      {id:"ctx-fill",type:"fill",source:"okinawa","source-layer":"muni",
        paint:{"fill-color":cv("--surface2"),"fill-opacity":0.45}},
      {id:"ctx-line",type:"line",source:"okinawa","source-layer":"muni",
        paint:{"line-color":cv("--line"),"line-width":0.8}},
      {id:"aza-fill",type:"fill",source:"okinawa","source-layer":"aza",filter:scopeFilter,
        paint:{"fill-color":cv("--surface"),"fill-opacity":0.95}},
      {id:"aza-line",type:"line",source:"okinawa","source-layer":"aza",filter:scopeFilter,
        paint:{"line-color":cv("--ai2"),"line-width":0.7}},
      {id:"scope-line",type:"line",source:"okinawa","source-layer":"muni",filter:scopeFilter,
        paint:{"line-color":cv("--ai"),"line-width":1.8}},
    ]:[
      {id:"bg",type:"background",paint:{"background-color":cv("--ground")}},
      {id:"muni-fill",type:"fill",source:"okinawa","source-layer":"muni",maxzoom:10,
        paint:{"fill-color":cv("--surface2"),"fill-opacity":0.9}},
      {id:"muni-line",type:"line",source:"okinawa","source-layer":"muni",maxzoom:10,
        paint:{"line-color":cv("--ai"),"line-width":1}},
      {id:"aza-fill",type:"fill",source:"okinawa","source-layer":"aza",minzoom:9,
        paint:{"fill-color":cv("--surface2"),"fill-opacity":0.85}},
      {id:"aza-line",type:"line",source:"okinawa","source-layer":"aza",minzoom:9,
        paint:{"line-color":cv("--line"),"line-width":0.6}},
    ],
  };
  // 市町村ページは最初に県全域を表示してタイルを読ませる。minZoomを先に7にすると
  // 表示が県中央のズーム7に丸められ、与那国町・大東村など遠い離島のタイルが
  // 読まれずbboxが取れなくなるので、寄せ終わってからminZoomを上げる。
  mapInstance=new maplibregl.Map({
    container:"map",style,
    ...(scoped?{bounds:OKINAWA_BOUNDS}:{center:[127.7,26.35],zoom:9}),
    minZoom:scoped?4:8, maxZoom:16, attributionControl:true,
  });
  mapInstance.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  for(const layer of scoped?["aza-fill"]:["muni-fill","aza-fill"]){
    mapInstance.on("mouseenter",layer,()=>{mapInstance.getCanvas().style.cursor="pointer";});
    mapInstance.on("mouseleave",layer,()=>{mapInstance.getCanvas().style.cursor="";});
  }
  if(scoped){
    // 市町村ごとの外接矩形を持っていないので、県全域を一度読み込んでから、
    // タイルに載ったmuniポリゴンでbboxを出して寄せる。取れなければ県全域のまま
    // （字レイヤーは絞られているのでどの市町村かは分かる）。例外にはしない。
    mapInstance.once("idle",()=>{
      if(!mapInstance)return;
      let feats=[];
      try{feats=mapInstance.querySourceFeatures("okinawa",{sourceLayer:"muni",filter:scopeFilter});}
      catch(err){feats=[];}
      const b=featureBounds(feats);
      if(!b)return;  // 取れなければ県全域のまま（字レイヤーは絞られている）
      mapInstance.fitBounds(b,{padding:26,duration:0,maxZoom:14});
      mapInstance.setMinZoom(7);
    });
    // ホバーで市町村名・字名を出す。県全体の地図には付けない。
    mapInstance.on("mousemove","aza-fill",e=>{
      const f=e.features&&e.features[0];if(!f)return;
      const sname=String(f.properties.S_NAME||"").trim();
      if(!mapTip)mapTip=new maplibregl.Popup(
        {closeButton:false,closeOnClick:false,className:"maptip",offset:12,maxWidth:"220px"});
      mapTip.setLngLat(e.lngLat)
        .setHTML(`${esc(scopeMuni?scopeMuni.name:"")}／${esc(sname||"（名称なし）")}`)
        .addTo(mapInstance);
    });
    mapInstance.on("mouseleave","aza-fill",()=>{if(mapTip)mapTip.remove();});
  }else{
    mapInstance.on("click","muni-fill",e=>{
      const f=e.features&&e.features[0];if(!f)return;
      const code=`${f.properties.PREF||""}${f.properties.CITY||""}`;
      if(find(code))go("muni",code);
      else mapNotice(e.lngLat,`この区域（コード ${esc(code)}）に対応する市町村データがありません。`);
    });
  }
  mapInstance.on("click","aza-fill",e=>{
    const f=e.features&&e.features[0];if(!f)return;
    const code=`${f.properties.PREF||""}${f.properties.CITY||""}`;
    const m=find(code);
    if(!m){mapNotice(e.lngLat,`この区域（コード ${esc(code)}）に対応する市町村データがありません。`);return;}
    const name=matchAzaName(m,f.properties.S_NAME);
    if(name){go("aza",azaId(m.code,name),m.code);return;}
    // 境界（令和2年国勢調査の調査区）と住基の字は区分が一致しないことがある。
    // 推測で近い字に飛ばすと別の字の数値を見せてしまうので、遷移せずに理由を出す。
    const sname=String(f.properties.S_NAME||"").trim();
    mapNotice(e.lngLat,
      `<b>${esc(m.name)}${sname?"／"+esc(sname):""}</b><br>`+
      `この区域はまだ字データとの対応付けができていません。`+
      `境界は令和2年国勢調査の調査区にもとづくため、住居表示上の町丁・字と一致しないこと`+
      `（2020年より後に新設された丁目など）があります。`+
      `<br>左の検索欄から字名で探すと、人口データがある場合は開けます。`);
  });
}
/** 遷移できないときに、その場で理由を出す。推測で別の字に飛ばさないための代替。 */
let mapPopup=null;
/** 市町村ページの地図のホバー吹き出し（市町村名／字名）。上の警告とは別物。 */
let mapTip=null;
function mapNotice(lngLat,html){
  if(!mapInstance)return;
  if(mapPopup)mapPopup.remove();
  mapPopup=new maplibregl.Popup({closeButton:true,maxWidth:"280px",className:"mapnotice"})
    .setLngLat(lngLat).setHTML(html).addTo(mapInstance);
}

/* ============================ イベント ============================ */
function go(kind,code,muniCode){
  if(kind==="muni"){view={...view,layer:"muni",code,aza:null};}
  else{view={...view,layer:"aza",code:muniCode,aza:code};}
  render();document.getElementById("stage").focus();
}
function bindStage(){
  const sel=document.getElementById("indsel");
  if(sel)sel.onchange=e=>{view.indicator=e.target.value;render();};
  const ps=document.getElementById("sortsel");
  if(ps)ps.onchange=e=>{view.sort={...view.sort,pref:e.target.value};render();};
  const as=document.getElementById("azasortsel");
  if(as)as.onchange=e=>{view.sort={...view.sort,aza:e.target.value};render();};
  if(view.layer==="pref")initMap();
  else if(view.layer==="muni")initMap(view.code);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-kind]");
  if(b){go(b.dataset.kind,b.dataset.code,b.dataset.muni||b.dataset.code);return;}
  const g=e.target.closest("[data-go]");
  if(g){view=g.dataset.go==="pref"?{...view,layer:"pref",code:null,aza:null}
                                  :{...view,layer:"muni",code:g.dataset.code,aza:null};render();}
});
document.getElementById("q").addEventListener("input",renderList);

/* バナーの件数はデータから数える。実データの割合を書き換え忘れて
   「字の年齢構成はサンプル値」と実態より低く見せないため（89%は実データ）。 */
(function(){
  const aza=MUNI.flatMap(m=>m.aza);
  const total=aza.length, real=aza.filter(a=>a.ageStatus==="matched").length;
  const sample=total-real;
  document.getElementById("datastate").innerHTML=
    `施策・空き家、市町村の人口推移・年齢構成、字の人口推移は<strong>実データ</strong>です。`+
    `字の年齢構成も${fmt(total)}字中<strong>${fmt(real)}字（${Math.round(real/total*100)}%）が実データ</strong>で、`+
    `国勢調査との対応が確認できなかった${fmt(sample)}字だけが<strong>サンプル値</strong>です`+
    `（斜線とタグが付いた図は架空の数値）。`;
})();

render();
</script>
