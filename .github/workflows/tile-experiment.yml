name: 検証専用 - PMTilesサイズ実測（使い捨て）

# Phase 6（マップ）の着手前に、境界データをPMTiles化した場合の実サイズを
# 確認するためだけのワークフロー。手動実行のみ。push では絶対に走らない。
# 検証が終わったらこのファイルごと削除するか、workflow_dispatch のまま残す。
on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GDAL（ogr2ogr）をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libsqlite3-dev zlib1g-dev

      - name: tippecanoeをソースからビルド（apt配布が無いため）
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe
          make -j"$(nproc)"
          sudo make install
          tippecanoe --version

      - name: 沖縄県 小地域（町丁・字等）境界Shapefileを取得
        run: |
          mkdir -p work
          curl -sL "https://www.e-stat.go.jp/gis/statmap-search/data?dlserveyId=A002005212020&code=47&coordSys=1&format=shape&downloadType=5&datum=2000" \
            -o work/r2ka47.zip
          cd work && unzip -o r2ka47.zip
          ls -la

      - name: 字ポリゴンをGeoJSONに変換（WGS84へ）
        run: |
          cd work
          ogr2ogr -f GeoJSON aza.geojson r2ka47.shp -t_srs EPSG:4326

      - name: 市町村ポリゴンをCITYコードでdissolveしてGeoJSONに変換
        run: |
          cd work
          ogr2ogr -f GeoJSON muni.geojson r2ka47.shp -t_srs EPSG:4326 \
            -dialect sqlite -sql "SELECT CITY, CITY_NAME, ST_Union(geometry) AS geometry FROM r2ka47 GROUP BY CITY, CITY_NAME"

      - name: tippecanoeでPMTiles化（字・市町村それぞれ単独ファイル）
        run: |
          cd work
          tippecanoe -o aza.pmtiles -l aza -Z0 -z14 --drop-densest-as-needed --force aza.geojson
          tippecanoe -o muni.pmtiles -l muni -Z0 -z10 --drop-densest-as-needed --force muni.geojson

      - name: サイズを実測してサマリに出す
        run: |
          cd work
          {
            echo "### PMTilesサイズ実測結果（沖縄県のみ）"
            echo "| ファイル | バイト数 | 人が読める形 |"
            echo "|---|---|---|"
            for f in aza.pmtiles muni.pmtiles; do
              sz=$(stat -c%s "$f")
              hr=$(numfmt --to=iec "$sz")
              echo "| $f | $sz | $hr |"
            done
            total=$(( $(stat -c%s aza.pmtiles) + $(stat -c%s muni.pmtiles) ))
            echo ""
            echo "合計: $(numfmt --to=iec "$total")（GitHub上限: 1ファイル100MB、リポジトリ全体1GB）"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la *.pmtiles

      - uses: actions/upload-artifact@v4
        with:
          name: pmtiles-experiment
          path: work/*.pmtiles
          retention-days: 7
